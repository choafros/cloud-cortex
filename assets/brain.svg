<style>
.cortex-organ{transform-origin:512px 299px;animation:think 7s ease-in-out infinite}
.cortex-branch{stroke:url(#neuron);stroke-width:1.65;opacity:.67}
.cortex-trace{stroke:#a3ebd2;stroke-width:2;opacity:.44;stroke-dasharray:3 15;animation:flow 14s linear infinite}
.cortex-dots{opacity:.65;animation:blink 5s ease-in-out infinite}
.cortex-outline{animation:blink 9s ease-in-out infinite}
@keyframes think{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes flow{to{stroke-dashoffset:-180}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.82}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
